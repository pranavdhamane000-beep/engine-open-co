[workspace]
resolver = "2"
members = [
    "crates/anim_core",
    "crates/anim_assets",
    "crates/anim_project",
    "crates/anim_commands",
    "crates/anim_scene",
    "crates/anim_sim",
    "crates/anim_render",
    "crates/anim_audio",
    "crates/anim_export",
    "crates/anim_editor",
    "crates/anim_app",
    "crates/anim_headless",
    "crates/anim_test_support",
    "crates/anim_character",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Versions recorded per spec 5.1; each becomes referenced when its WP lands.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ash = "0.38"
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
blake3 = "1"
hex = "0.4"
wgpu = "27"
bytemuck = "1"
half = "2"
glam = "0.30"
winit = "0.30"
egui = "0.33"
egui-dock = "0.18"
egui-winit = { version = "0.33", default-features = false }
symphonia = { version = "0.5", features = ["wav", "ogg", "flac", "vorbis"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rubato = "0.16"
hound = "3.5"
cpal = "0.16"
ringbuf = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
criterion = "0.5"
tempfile = "3"
pollster = "0.4"
tokio = { version = "1", features = ["full"] }
which = "6"

[profile.release]
lto = false
codegen-units = 256